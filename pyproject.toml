[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-formula-helper"
version = "0.1.0"
description = "Turn plain-English requests into Excel and Google Sheets formulas via a local OpenAI-compatible endpoint (default Ollama)."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]
dependencies = ["requests>=2.28.0"]

[project.scripts]
sheet-formula-helper = "sheet_formula_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sheet_formula_helper*"]
